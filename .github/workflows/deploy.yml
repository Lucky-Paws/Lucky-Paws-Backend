on:
  push:
    branches: [ "main" ]  # main 브랜치에 push될 때만 이 워크플로우가 실행됨

jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub Actions가 사용하는 가상 머신 환경 (우분투 최신 버전)
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 현재 저장소의 코드를 가져옴 (필수 단계)

      - name: Set up JDK
        uses: actions/setup-java@v4  # Java 빌드 환경을 설정함
        with:
          distribution: 'temurin'
          java-version: '17'  # Java 17 버전을 사용함 (Dockerfile과 일치해야 함)

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build -x test  # Gradle로 프로젝트를 빌드함. 테스트는 제외 (-x test)

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1  # ECR에 로그인. 이후 Docker push를 하기 위함
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI=888042016323.dkr.ecr.ap-northeast-2.amazonaws.com/luckypaws:latest  # 사용할 Docker 이미지 태그 정의
          docker build -t $IMAGE_URI .  # 현재 디렉토리(.)에 있는 Dockerfile을 기준으로 이미지 빌드
          docker push $IMAGE_URI  # 빌드한 이미지를 ECR에 push (업로드)

      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # PATH 설정 추가 (가장 확실한 방법)
            export PATH=$PATH:/usr/local/bin:/usr/bin
            
            cat <<EOF > .env
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            EOF
            docker stop app || true && docker rm app || true
            
            # docker login 전에 AWS CLI가 제대로 설정되었는지 확인 (디버깅용)
            /usr/local/bin/aws --version
            
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 888042016323.dkr.ecr.ap-northeast-2.amazonaws.com
            docker pull 888042016323.dkr.ecr.ap-northeast-2.amazonaws.com/luckypaws:latest
            docker run -d \
              --name app \
              --env-file .env \
              -p 8080:8080 \
              888042016323.dkr.ecr.ap-northeast-2.amazonaws.com/luckypaws:latest
