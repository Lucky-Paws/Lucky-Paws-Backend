name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches:
      - main # main 브랜치에 push가 발생할 때 워크플로우 실행

env:
  AWS_REGION: ap-northeast-2 # AWS 리전 (예: 서울 리전)
  ECR_REPOSITORY: luckypaws # ECR에 생성할 Docker 이미지 저장소 이름
  EC2_INSTANCE_IP: 146.56.99.100 # EC2 인스턴스의 퍼블릭 IP 주소
  EC2_USERNAME: ec2-user # EC2 인스턴스의 사용자 이름 (Ubuntu AMI의 기본 사용자)
  # SPRING_PROFILES_ACTIVE: prod # 필요한 경우 Spring Profile 활성화 (application-prod.properties 사용 시)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 워크플로우를 실행할 가상 환경 (GitHub 호스팅 러너)

    steps:
      - name: Checkout repository # 1. GitHub 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Set up JDK 17 # 2. Java 21 및 Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          gradle-version: '8.14.3' # 사용하는 Gradle 버전에 맞춰 수정 (예: '8.4')

      - name: Grant execute permission for gradlew # gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle # 3. Spring Boot 애플리케이션 빌드 (JAR 파일 생성)
        run: ./gradlew clean bootJar

      - name: Configure AWS credentials # 4. AWS 인증 (IAM 사용자 키 사용)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # GitHub Secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # GitHub Secret
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR # 5. ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image # 6 & 7. Docker 이미지 빌드 및 ECR 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }} # Git 커밋 SHA를 이미지 태그로 사용 (고유성 보장)
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: SSH into EC2 and Deploy # 8. EC2에 SSH 접속 및 배포
        uses: appleboy/ssh-action@v0.1.10 # SSH 접속을 위한 GitHub Action
        with:
          host: ${{ env.EC2_INSTANCE_IP }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }} # GitHub Secret (EC2 접속 private key)
          script: |
            # 기존 Docker 컨테이너 중지 및 삭제 (선택 사항, 필요시)
            if docker ps -a | grep ${{ env.ECR_REPOSITORY }}; then
              docker stop ${{ env.ECR_REPOSITORY }}
              docker rm ${{ env.ECR_REPOSITORY }}
            fi

            # 새로운 Docker 이미지 풀 (pull)
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            # 새로운 Docker 컨테이너 실행
            # -d: 백그라운드 실행, -p: 포트 매핑 (호스트포트:컨테이너포트), --name: 컨테이너 이름
            # 환경 변수 필요 시 -e 옵션 추가 (예: -e SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILES_ACTIVE }})
            docker run -d -p 8080:8080 --name ${{ env.ECR_REPOSITORY }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            
            # Docker 컨테이너 로그 확인 (선택 사항, 디버깅 용)
            docker logs ${{ env.ECR_REPOSITORY }}