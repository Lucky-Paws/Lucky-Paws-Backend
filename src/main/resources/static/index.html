<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>WebSocket 채팅 클라이언트</title>
</head>
<body>
<h2>🧪 WebSocket 채팅 클라이언트</h2>
<div>
    <label for="serverIP">서버 주소 (ex. 43.200.175.153:8080):</label>
    <input type="text" id="serverIP" value="43.200.175.153:8080" />
</div>

<div>
    <label for="roomId">채팅방 ID:</label>
    <input type="text" id="roomId" value="1" />
    <button onclick="connect()">접속</button>
</div>

<div id="chatLog" style="border:1px solid #ccc; width:500px; height:200px; overflow:auto; margin-top:10px;"></div>

<div>
    <input type="text" id="messageInput" placeholder="메시지를 입력하세요" />
    <button onclick="sendMessage()">전송</button>
</div>

<script>
    let socket;
    let currentChatRoomId;

    function getWebSocketProtocol() {
        return location.protocol === "https:" ? "wss" : "ws";
    }

    function getHttpProtocol() {
        return location.protocol === "https:" ? "https" : "http";
    }

    function connect() {
        const serverIP = document.getElementById("serverIP").value;
        currentChatRoomId = document.getElementById("roomId").value;

        const wsUrl = `${getWebSocketProtocol()}://${serverIP}/ws/chat/${currentChatRoomId}`;
        log(`🔌 WebSocket 연결 시도: ${wsUrl}`);

        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            log("✅ 연결 성공");
            fetchAndDisplayOldMessages(serverIP, currentChatRoomId);
        };

        socket.onmessage = (event) => {
            log("📩 받은 메시지: " + event.data);
        };

        socket.onerror = (event) => {
            log("❌ 연결 실패");
            console.error(event);
        };

        socket.onclose = (event) => {
            log(`🔌 WebSocket 연결 해제됨: ${event.code}`);
        };
    }

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const message = input.value;
        if (message && socket && socket.readyState === WebSocket.OPEN) {
            socket.send(message);
            log("📤 보낸 메시지: " + message);
            input.value = "";
        }
    }

    function fetchAndDisplayOldMessages(serverIP, roomId) {
        const apiUrl = `${getHttpProtocol()}://${serverIP}/api/chat/room/${roomId}/messages`;
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error("네트워크 응답 오류");
                return response.json();
            })
            .then(data => {
                data.forEach(msg => {
                    log(`🕓 [이전] ${msg.sender}: ${msg.content}`);
                });
            })
            .catch(error => {
                log(`[${roomId}번 방] 기존 메시지를 불러오는 데 실패했습니다: ${error}`);
            });
    }

    function log(message) {
        const logDiv = document.getElementById("chatLog");
        const p = document.createElement("p");
        p.textContent = message;
        logDiv.appendChild(p);
        logDiv.scrollTop = logDiv.scrollHeight;
    }
</script>
</body>
</html>
