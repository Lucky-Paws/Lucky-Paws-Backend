spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update  # 앱 실행할 때 엔티티 기준으로 테이블 자동 생성
    properties:
      hibernate:
        format_sql: true
        show_sql: true
